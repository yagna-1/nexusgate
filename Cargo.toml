[package]
name = "nexusgate"
version = "0.1.0"
edition = "2021"
description = "Intelligent multi-provider LLM gateway with cost governance"

[[bin]]
name = "nexusgate"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for provider calls (rustls = no system OpenSSL needed)
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# Redis (rate limit state, budget counters)
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# SQLite (cost records, API keys)
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "chrono"] }

# Auth
jsonwebtoken = "9"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
async-trait = "0.1"
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
